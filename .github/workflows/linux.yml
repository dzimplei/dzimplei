# The Linux build, run in the PUBLIC repo t-shark-9/dzimplei so it costs nothing (see public-windows.yml for why). This file is the copy that
# lives at t-shark-9/dzimplei/.github/workflows/linux.yml; keep the two equal.
#
# Two native builds, not a cross build: the app bundles native helper binaries per architecture
# (scripts/after-pack.mjs), so x64 is built on an x64 runner and arm64 on GitHub's arm runner. x64 gives an AppImage and a .deb; arm64 an AppImage
# (the .deb tool electron-builder bundles has no arm64 build). Each leaves its own update feed (latest-linux.yml, latest-linux-arm64.yml), which
# scripts/publish-update.sh already knows. A public repo's logs are public: nothing here prints config or secrets.
name: linux
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "dzimplei-source commit to build"
        required: true

permissions:
  contents: read

env:
  DZ_BASE: /dzimplei/

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64]
    uses: ./.github/workflows/terminal-core.yml
    with:
      ref: ${{ inputs.ref }}
      platform: ${{ matrix.platform }}
    secrets: inherit
  build:
    needs: terminal
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            targets: "AppImage deb"
          - arch: arm64
            runner: ubuntu-22.04-arm
            targets: "AppImage"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dzimplei/dzimplei-source
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: terminal-core-linux-${{ matrix.arch }}
          path: build
      - name: Record source revision and terminal permissions
        run: |
          chmod +x build/herdr-core
          git rev-parse HEAD > build/commit.txt
      - run: npm run build
      - run: npm run build:server
      - run: npx electron-builder --linux ${{ matrix.targets }} --${{ matrix.arch }} --publish never
      - name: Verify the packaged Linux runtime
        run: |
          node scripts/desktop-acceptance.mjs release/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/dzimplei release/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/resources/app
          node scripts/desktop-manifest.mjs release/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/resources/app linux release/desktop-linux-${{ matrix.arch }}-manifest.json
          for feed in release/latest-linux*.yml; do printf '\nsourceRevision: %s\n' "$(git rev-parse HEAD)" >> "$feed"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzimplei-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux*.yml
            release/desktop-linux-*-manifest.json
