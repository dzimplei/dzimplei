name: server
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed source revision for the published release
        required: true
permissions:
  contents: read
jobs:
  verify-published:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SOURCE_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node .github/scripts/verify-release-097.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-097-verification
          path: release-097-proof.json
          if-no-files-found: error
          retention-days: 7
