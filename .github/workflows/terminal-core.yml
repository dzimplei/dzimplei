name: terminal-core
# A bundled component, built from the gitlink, never fetched by a runtime updater.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private source commit to build"
        type: string
        required: true
      platform:
        type: choice
        required: true
        default: darwin-arm64
        options: [darwin-arm64, linux-arm64, linux-x64, win32-x64]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      platform:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.platform == 'darwin-arm64' && 'macos-15' || inputs.platform == 'win32-x64' && 'windows-2025' || inputs.platform == 'linux-x64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dzimplei/dzimplei-source
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          submodules: recursive
          persist-credentials: false
      - name: Select the release target
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          case "$BUILD_PLATFORM" in
            darwin-arm64) target=aarch64-apple-darwin; suffix= ;;
            linux-arm64) target=aarch64-unknown-linux-musl; suffix= ;;
            linux-x64) target=x86_64-unknown-linux-musl; suffix= ;;
            win32-x64) target=x86_64-pc-windows-msvc; suffix=.exe ;;
            *) echo 'unsupported terminal-core platform' >&2; exit 1 ;;
          esac
          printf 'HERDR_TARGET=%s\nHERDR_SUFFIX=%s\n' "$target" "$suffix" >> "$GITHUB_ENV"
      - name: Install the native Linux musl linker
        if: inputs.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          targets: ${{ env.HERDR_TARGET }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: third_party/herdr-core -> target
          key: terminal-core-${{ env.HERDR_TARGET }}
      - name: Build the pinned source and lockfile
        working-directory: third_party/herdr-core
        run: cargo build --release --locked --target "$HERDR_TARGET" -p herdr-core
      - name: Assemble the internal runtime and license notices
        run: |
          mkdir -p build
          cp "third_party/herdr-core/target/$HERDR_TARGET/release/herdr-core$HERDR_SUFFIX" "build/herdr-core$HERDR_SUFFIX"
          chmod +x "build/herdr-core$HERDR_SUFFIX"
          cp third_party/herdr-core/LICENSE build/herdr-core.LICENSE
          "build/herdr-core$HERDR_SUFFIX" --licenses > build/herdr-core.NOTICES
          printf 'source=%s\nghostty=%s\nrust=1.95.0\nzig=0.16.0\nprotocol=1\ntarget=%s\n' "$(git -C third_party/herdr-core rev-parse HEAD)" "$(git -C third_party/herdr-core/vendor/ghostty rev-parse HEAD)" "$HERDR_TARGET" > build/herdr-core.SOURCE
      - name: Bundle the pinned Windows PTY dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: third_party/herdr-core/scripts/fetch-conpty.ps1 -Dest build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prove detach, service death, reconnect, interrupt and cleanup
        env:
          HERDR_TEST_BINARY: ${{ github.workspace }}/build/herdr-core${{ env.HERDR_SUFFIX }}
        run: node --test server/herdrTerminal.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-core-${{ inputs.platform }}
          path: build/
          if-no-files-found: error
          retention-days: 7
